name: Cleanup Untagged Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'

jobs:
  delete-untagged:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete untagged images for rep2
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'rep2'
          package-type: 'container'
          min-versions-to-keep: 30
          delete-only-untagged-versions: 'true'
          # token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete untagged images for rep2-extra
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'rep2-extra'
          package-type: 'container'
          min-versions-to-keep: 30
          delete-only-untagged-versions: 'true'
          # token: ${{ secrets.GITHUB_TOKEN }}