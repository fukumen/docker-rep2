name: Build and Publish Docker

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - php8
  #   paths-ignore:
  #     - '**.md'
  repository_dispatch:
    types: [p2-php-update]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log Upstream Trigger Info
        if: github.event.client_payload.run_id
        run: |
          echo "Triggered by p2-php run: https://github.com/fukumen/p2-php/actions/runs/${{ github.event.client_payload.run_id }}"
          echo "Source SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: meta
        run: |
          REPO_HASH=$(git rev-parse --short HEAD)
          echo "REPO_HASH=${REPO_HASH}" >> "$GITHUB_OUTPUT"
          REPO_RAW_LOG=$(TZ=Asia/Tokyo git log -1 --format='%cd %s' --date=format-local:'%Y-%m-%d %H:%M' | head -n 1)
          echo "REPO_LOG=$(echo -n "$REPO_RAW_LOG" | base64 -w 0)" >> "$GITHUB_OUTPUT"

          git clone --depth 1 --branch php8-merge-mbstring https://github.com/fukumen/p2-php.git temp_p2
          cd temp_p2
          
          REP2_HASH=$(git rev-parse --short HEAD)
          REP2_RAW_LOG=$(TZ=Asia/Tokyo git log -1 --format='%cd %s' --date=format-local:'%Y-%m-%d %H:%M' | head -n 1)
          
          echo "REP2_HASH=${REP2_HASH}" >> "$GITHUB_OUTPUT"
          echo "REP2_LOG=$(echo -n "$REP2_RAW_LOG" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "REP2_LOG_PLAIN=${REP2_RAW_LOG}" >> "$GITHUB_OUTPUT"
          
          cd ..
          rm -rf temp_p2

      - name: Build local image for version extraction
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rep2:local
          build-contexts: |
            p2-rep2=https://github.com/fukumen/p2-php.git#php8-merge-mbstring
            2chproxy.pl=https://github.com/fukumen/2chproxy.pl.git#always-https-for-2ch-config

      - name: Extract versions from image
        id: versions
        run: |
          ALPINE_VER=$(docker run --rm rep2:local cat /etc/alpine-release)
          PHP_VER=$(docker run --rm rep2:local php -r 'echo PHP_VERSION;')
          CADDY_VER=$(docker run --rm rep2:local caddy version | awk '{print $1}')
          
          echo "alpine=${ALPINE_VER}" >> "$GITHUB_OUTPUT"
          echo "php=${PHP_VER}" >> "$GITHUB_OUTPUT"
          echo "caddy=${CADDY_VER}" >> "$GITHUB_OUTPUT"

      - name: Generate Date Tag
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      # Build rep2 (Standard)
      - name: Build and push rep2
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: |
            p2-rep2=https://github.com/fukumen/p2-php.git#php8-merge-mbstring
            2chproxy.pl=https://github.com/fukumen/2chproxy.pl.git#always-https-for-2ch-config
          build-args: |
            REPO_HASH=${{ steps.meta.outputs.REPO_HASH }}
            REPO_LOG=${{ steps.meta.outputs.REPO_LOG }}
            REP2_HASH=${{ steps.meta.outputs.REP2_HASH }}
            REP2_LOG=${{ steps.meta.outputs.REP2_LOG }}
            RUN_ID=${{ github.run_id }}
            RUN_NUMBER=${{ github.run_number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rep2:latest
            ghcr.io/${{ github.repository_owner }}/rep2:${{ steps.date.outputs.today }}
          annotations: |
            org.opencontainers.image.description=Alpine: ${{ steps.versions.outputs.alpine }} / PHP: ${{ steps.versions.outputs.php }} / Caddy: ${{ steps.versions.outputs.caddy }} / rep2: ${{ steps.meta.outputs.REP2_LOG_PLAIN }} (${{ steps.meta.outputs.REP2_HASH }})

      # Build rep2-extra (With Extra Packages)
      - name: Build and push rep2-extra
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: |
            p2-rep2=https://github.com/fukumen/p2-php.git#php8-merge-mbstring
            2chproxy.pl=https://github.com/fukumen/2chproxy.pl.git#always-https-for-2ch-config
          build-args: |
            FLAG_EXTRA=true
            REPO_HASH=${{ steps.meta.outputs.REPO_HASH }}
            REPO_LOG=${{ steps.meta.outputs.REPO_LOG }}
            REP2_HASH=${{ steps.meta.outputs.REP2_HASH }}
            REP2_LOG=${{ steps.meta.outputs.REP2_LOG }}
            RUN_ID=${{ github.run_id }}
            RUN_NUMBER=${{ github.run_number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rep2-extra:latest
            ghcr.io/${{ github.repository_owner }}/rep2-extra:${{ steps.date.outputs.today }}
          annotations: |
            org.opencontainers.image.description=Alpine: ${{ steps.versions.outputs.alpine }} / PHP: ${{ steps.versions.outputs.php }} / Caddy: ${{ steps.versions.outputs.caddy }} / rep2: ${{ steps.meta.outputs.REP2_LOG_PLAIN }} (${{ steps.meta.outputs.REP2_HASH }})
